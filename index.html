<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>紫府仙缘</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{
  font-family:"KaiTi","STKaiti","Songti SC","PingFang SC","Microsoft YaHei",serif;
  color:#33291f;background:#e9e2d4;line-height:1.72;font-size:14px;min-height:100%;
  transition:background-color 1s ease;
}
button:disabled{opacity:.38!important;filter:grayscale(.55);cursor:not-allowed!important}
.app{max-width:1120px;margin:0 auto;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:100vh;position:relative;z-index:2}

#seasonFx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:40}
#seasonFx i{position:absolute;top:-30px;display:block;border-radius:50%;opacity:.5;will-change:transform}

/* 顶栏 */
.top{background:#faf6ee;border:1px solid #d8cbb4;border-radius:3px;padding:9px 14px;
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.top h1{font-size:15px;font-weight:400;letter-spacing:5px;color:#6f4526}
.top h1 small{font-size:10px;letter-spacing:2px;color:#a08e78;margin-left:8px}
.saveBtn{font-family:inherit;font-size:11px;letter-spacing:1px;padding:4px 10px;border-radius:2px;cursor:pointer;
  border:1px solid #c9bba5;background:#f2ebdd;color:#6f5c48}
.saveBtn:hover{background:#e9dfc9}
.hintBar{display:flex;align-items:center;gap:7px;background:#f5efe3;border:1px solid #e0d5c0;border-radius:3px;
  padding:5px 10px;font-size:11.5px;color:#6f5c48;flex:0 0 auto;min-width:0}
.hintBar .tag{color:#8a6420;letter-spacing:2px;white-space:nowrap}
.hintBar .hintText{flex:1;min-width:0;line-height:1.5}
.hintBar button{flex:0 0 auto;font-family:inherit;font-size:10.5px;padding:3px 9px;border-radius:2px;cursor:pointer;
  border:1px solid #849a72;background:#eef1e6;color:#4c5a3c;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#f2ebdd;border:1px solid #d8cbb4;border-radius:2px;padding:3px 10px;font-size:11.5px;color:#6f5c48;white-space:nowrap}
.chip b{color:#6f4526;font-weight:400;font-size:13px;font-variant-numeric:tabular-nums}
.chip.jade{background:#eef2ea;border-color:#b9c9ae;color:#4d6242}
.chip.jade b{color:#3f5735}
.chip.danger{background:#f6e8e5;border-color:#d9b5ae;color:#8f3a2c}
.chip.danger b{color:#8f3a2c}
.chip.danger.low{animation:pulseRed 1.8s ease-in-out infinite}
@keyframes pulseRed{0%,100%{box-shadow:0 0 0 0 rgba(143,58,44,0)}50%{box-shadow:0 0 0 4px rgba(143,58,44,.15)}}
.chip.ap{background:#eef1e6;border-color:#c2ccb0;color:#4c5a3c}
.chip.zf{background:#e8e5f2;border-color:#bbb3d6;color:#494080}
.chip.zf b{color:#494080}
.dots{letter-spacing:2px;font-size:12px}
.dots i{font-style:normal;color:#8aa87a;opacity:.18;transition:opacity .15s}
.dots i.on{opacity:1}

/* 布局 */
.main{display:grid;grid-template-columns:1fr 320px;gap:8px;align-items:stretch;flex:1}
@media(max-width:880px){.main{grid-template-columns:1fr}}.main > .panel{display:flex;flex-direction:column;min-height:340px}

.panel{background:#faf6ee;border:1px solid #d8cbb4;border-radius:3px;padding:11px 14px}
.panel h3{font-size:12.5px;font-weight:400;letter-spacing:4px;color:#7a4f30;
  border-bottom:1px solid #e0d5c0;padding-bottom:6px;margin-bottom:9px;
  display:flex;justify-content:space-between;align-items:center}
.panel h3 em{font-style:normal;font-size:10.5px;color:#a08e78;letter-spacing:0}

.scene{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden}
.scene>*{flex-shrink:0}

/* 视觉小说叙述 */
.vn{font-size:13.5px;color:#4a3c2e;line-height:2.05;letter-spacing:.3px;
  padding:2px 2px 12px;border-bottom:1px dashed #e0d5c0;margin-bottom:11px}
.vn p{margin-bottom:7px}
.vn p:last-child{margin-bottom:0}
.vn .say{color:#7a4f30}
.vn .em{color:#8f3a2c}
.vn .zi{color:#5a4bb8}

/* 田 */
.yard{position:relative;min-height:220px}
.plots{display:grid;grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:7px;align-content:start}
.plot{background:#fdfaf3;border:1px solid #ddd0bb;border-radius:3px;padding:8px 9px;
  display:flex;flex-direction:column;gap:4px;position:relative;min-height:132px}
.plot .no{position:absolute;right:8px;top:5px;font-size:10px;color:#c0af94;letter-spacing:1px}
.plot .nm{font-size:12.5px;color:#54462f;letter-spacing:1px;padding-right:16px}
.plot .st{font-size:10.5px;color:#9c8a70;min-height:14px}
.bar{height:4px;background:#e9e0cd;border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:#849a72;border-radius:2px;transition:width .3s ease}
.bar.earth{background:#e6dcc6}
.bar.earth i{background:#ad8657}
.plot .rw{display:flex;gap:4px}
.plot .rw button{flex:1}
.plot.waste{background:#f5f0e4;border-style:dashed}
.plot.waste .nm{color:#ad9c85}
.plot button{font-family:inherit;font-size:11.5px;padding:4px 0;border-radius:2px;cursor:pointer;
  border:1px solid #d8cbb4;background:#f2ebdd;color:#54462f;transition:background .12s}
.plot button:hover:not(:disabled){background:#e9dfc9}
.plot button:disabled{opacity:.35;cursor:default}
.plot button.go{background:#849a72;border-color:#849a72;color:#fff}
.plot button.go:hover{background:#748a62}
.plot button.zi{background:#7d6bc4;border-color:#7d6bc4;color:#fff}
.plot button.zi:hover{background:#6d5ab4}
.plot.zifu{background:#f1edf7;border-color:#b9add4}
.plot.zifu .nm{color:#5b4b83}
.plot.zifu .st{color:#8a7aa8}
.plot.zifu .zbar{background:#e5ddf2}
.plot.zifu .zbar i{background:#8a76c4}

/* 水墨线稿图标 */
.inkIcon{display:inline-block;width:23px;height:23px;flex:0 0 auto;vertical-align:middle;
  fill:none;stroke:currentColor;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round;opacity:.82}
.inkIcon.big{width:34px;height:34px;stroke-width:1.35}
.fcard .inkIcon.big{color:#7a4f30}
.avatarWrap{display:inline-grid;place-items:center;width:48px;height:48px;border-radius:50%;
  overflow:hidden;flex:0 0 auto;margin-bottom:3px}
.portraitArt{display:block;width:100%;height:100%}
.w-mother{background:#EADBC7}
.w-brother{background:#DDE8D7}
.w-sister{background:#F4DCE1}
.w-official{background:#D9E0E6}
.w-elder{background:#E7E0D4}
.w-neighbor{background:#DCE7D9}
.tree .glyph .inkIcon{width:92px;height:92px;stroke-width:1.1;opacity:.78}

/* 家 */
.famrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(126px,1fr));gap:8px;margin-bottom:10px}
.fcard{background:#fdfaf3;border:1px solid #ddd0bb;border-radius:3px;padding:10px 11px}
.fcard .fn{font-size:13px;color:#54462f;letter-spacing:1px;margin-top:5px}
.fcard .fbar{height:3px;background:#e9e0cd;border-radius:2px;margin:7px 0 4px;overflow:hidden}
.fcard .fbar i{display:block;height:100%;background:#b08a8a;border-radius:2px;transition:width .3s}
.fcard em{font-style:normal;font-size:10.5px;color:#9c8a70;line-height:1.5;display:block}

.sc-acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.sc-acts button{font-family:inherit;font-size:12.5px;padding:8px 14px;border-radius:2px;cursor:pointer;
  border:1px solid #d8cbb4;background:#fdfaf3;color:#4a3c2e;transition:background .12s}
.sc-acts button:hover:not(:disabled){background:#f2ebdd}
.sc-acts button:disabled{opacity:.35;cursor:default}
.sc-acts button.free{border-color:#c2ccb0;background:#eef1e6;color:#4c5a3c}
.sc-acts button.hot{background:#849a72;border-color:#849a72;color:#fff}
.sc-acts button.hot:hover{background:#748a62}
.sc-acts button.quiet{background:#f5f0e4;border-color:#e0d5c0;color:#9c8a70;font-size:11.5px}
.mobileOnly{display:none!important}
.eggSpot{display:block;margin:11px auto 2px;padding:4px 8px;border:0;border-bottom:1px dashed #d2c2a9;
  background:transparent;color:#a08e78;font-family:inherit;font-size:10.5px;letter-spacing:1px;cursor:pointer}
.eggSpot:hover{color:#7a4f30}
.eggSpot:disabled{opacity:.45;cursor:default}

/* 老槐树 */
.tree{width:100%;height:140px;display:grid;place-items:center;cursor:pointer;user-select:none;position:relative}
.tree .glyph{font-size:76px;line-height:1;filter:drop-shadow(0 6px 6px rgba(80,60,40,.22))}
.tree .hint{position:absolute;bottom:0;font-size:10.5px;color:#c0af94;letter-spacing:2px}

/* 道行 */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.st{background:#fdfaf3;border:1px solid #ddd0bb;border-radius:3px;padding:9px 11px}
.st span{font-size:10.5px;color:#9c8a70;letter-spacing:2px;display:block}
.st b{font-size:17px;font-weight:400;color:#54462f;font-variant-numeric:tabular-nums}
.traitHead{display:flex;justify-content:space-between;align-items:center;margin:13px 0 6px;
  font-size:11.5px;letter-spacing:4px;color:#7a4f30}
.traitHead em{font-style:normal;font-size:10.5px;letter-spacing:0;color:#a08e78}
.traits{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:6px}
.trait{background:#f5f0e4;border:1px dashed #ddd0bb;border-radius:2px;padding:7px 9px;opacity:.58}
.trait.on{background:#eef1e6;border:1px solid #b9c9ae;opacity:1}
.trait b{display:block;font-size:12px;font-weight:400;letter-spacing:1px;color:#9c8a70}
.trait.on b{color:#3f5735}
.trait em{display:block;font-style:normal;font-size:10px;line-height:1.55;color:#a08e78;margin-top:2px}
.trait.on em{color:#657a58}

/* 人物 */
.heroCard{display:flex;gap:11px;align-items:center;background:#fdfaf3;border:1px solid #ddd0bb;
  border-radius:3px;padding:9px 12px;margin-top:10px}
.heroCard .hn{font-size:13.5px;color:#54462f;letter-spacing:1px}
.heroCard .hm{font-size:10.5px;color:#9c8a70;line-height:1.7}
.heroCard .hs{margin-left:auto;text-align:right;font-size:10.5px;color:#a08e78;line-height:1.7}
.heroCard .hs b{font-weight:400;color:#6f4526}

/* 传闻 */
.rumorBox{border:1px solid #e0d5c0;background:#fdfaf3;border-radius:3px;margin-top:10px;overflow:hidden}
.rumorHead{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;
  border-bottom:1px dashed #e6dccb;background:#f7f1e6;font-size:11px;letter-spacing:3px;color:#8a6420}
.rumorHead em{font-style:normal;letter-spacing:0;font-size:10px;color:#b0a08a}
.rumorBox .empty{padding:12px 10px;font-size:11.5px;color:#b0a08a}
.rumorBox p{font-size:12px;line-height:1.75;color:#5d4e3c;padding:7px 10px;border-bottom:1px dotted #eee5d3}
.rumorBox p:last-child{border-bottom:0}
.rumorBox time{font-size:10px;color:#b0a08a;margin-right:7px;font-variant-numeric:tabular-nums}

/* 紫府指引 */
.zfguide{width:100%;margin-top:6px;font-family:inherit;font-size:11px;padding:5px;border-radius:2px;
  border:1px dashed #464070;background:transparent;color:#9c93c8;cursor:pointer;letter-spacing:2px}
.zfguide:hover{background:#25213f;color:#d4cdf2}
.guideNow{background:#f2ebdd;border-left:2px solid #7d6bc4;padding:8px 10px;font-size:12px;
  line-height:1.85;color:#5d4e3c;margin-bottom:11px}
.guideNow b{font-weight:400;color:#5a4bb8}

/* 家畜 */
#petLayer{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:12}
.pet{position:absolute;left:0;top:0;line-height:1;cursor:pointer;user-select:none;will-change:transform;z-index:5;pointer-events:auto}
.pet .body{display:inline-block;font-size:36px;width:1em;height:1em;line-height:1;
  filter:drop-shadow(0 4px 4px rgba(90,70,50,.3));will-change:transform;transform-origin:50% 100%}
.petArt{display:block;width:100%;height:100%}
.emojiPet{display:block;width:100%;height:100%;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  font-size:1em;line-height:1;text-align:center}
.cardPet{display:inline-block;width:40px;height:40px;margin-bottom:2px;font-size:34px;line-height:40px}
.cardPet .emojiPet{line-height:40px}
.miniPet{display:inline-block;width:26px;height:26px;vertical-align:-7px;margin-right:4px;font-size:22px;line-height:26px}
.miniPet .emojiPet{line-height:26px}
.pet .shadow{position:absolute;left:50%;bottom:-3px;width:22px;height:6px;border-radius:50%;
  transform:translateX(-50%);background:radial-gradient(closest-side,rgba(90,70,50,.2),transparent);z-index:-1}
.pet .bub{position:absolute;left:50%;bottom:100%;margin-bottom:5px;transform:translateX(-50%);
  white-space:nowrap;font-size:11px;font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:#6b5a4a;
  background:#fdfaf3;border:1px solid #ddd0bb;border-radius:3px;padding:1px 7px;opacity:0;pointer-events:none}

/* 紫府 */
.zfbox{background:#15122a;border-radius:3px;padding:11px 12px;color:#cbc4e6;position:relative;overflow:hidden;
  border:1px solid #2b2746}
.zfbox h3{border-bottom:1px solid #332e52;color:#b0a6e0;font-size:12.5px;font-weight:400;letter-spacing:4px;
  padding-bottom:6px;margin-bottom:9px;display:flex;justify-content:space-between;position:relative;z-index:3}
.zfbox h3 em{font-style:normal;font-size:10.5px;color:#7a71a4;letter-spacing:0}
.well{position:relative;height:104px;border-radius:3px;overflow:hidden;margin-bottom:9px;cursor:pointer;
  box-shadow:inset 0 0 26px rgba(0,0,0,.85),inset 0 2px 0 rgba(150,130,255,.1)}
.well .fog{position:absolute;inset:-40%;pointer-events:none;
  background:radial-gradient(closest-side,rgba(150,150,168,.15),transparent 70%),
             radial-gradient(closest-side at 70% 60%,rgba(120,120,140,.12),transparent 72%);
  filter:blur(4px)}
.well .bolt{position:absolute;inset:0;opacity:0;pointer-events:none}
.well .bolt svg{width:100%;height:100%}
.cells{position:absolute;left:9px;right:9px;bottom:9px;display:grid;
  grid-template-columns:repeat(10,1fr);gap:3px;z-index:2}
.cells i{height:11px;border-radius:1px;background:#282440;border:1px solid #38325c;
  transition:background .5s,border-color .5s,box-shadow .5s;will-change:transform}
.cells i.on{background:linear-gradient(180deg,#5fbf93,#3a855e);border-color:#74d8a8;
  box-shadow:0 0 7px rgba(95,191,147,.7)}
.zfstat{font-size:11.5px;color:#9890bf;margin-bottom:8px;display:flex;justify-content:space-between;position:relative;z-index:3}
.zfstat b{color:#c5bdf0;font-weight:400}
.zfbtn{width:100%;font-family:inherit;font-size:12.5px;padding:7px;border-radius:2px;cursor:pointer;
  border:1px solid #464070;background:#2f2a50;color:#cbc4e6;transition:background .12s;position:relative;z-index:3}
.zfbtn:hover:not(:disabled){background:#3a3461}
.zfbtn:disabled{opacity:.35;cursor:default}
.zfnote{font-size:10.5px;color:#7a71a4;margin-top:7px;line-height:1.55;position:relative;z-index:3}
.zfgoal{font-size:10.5px;color:#b9b0e2;margin-top:6px;padding-top:6px;border-top:1px dashed #332e52;
  position:relative;z-index:3;line-height:1.6}
.zfgoal b{font-weight:400;color:#d4cdf2}
.zfclose{display:none}
#mobileBackdrop{display:none}

/* 道途 */
.path{background:#faf6ee;border:1px solid #d8cbb4;border-radius:3px;padding:11px 14px}
.path h3{font-size:12.5px;font-weight:400;letter-spacing:4px;color:#7a4f30;
  border-bottom:1px solid #e0d5c0;padding-bottom:6px;margin-bottom:9px;
  display:flex;justify-content:space-between;align-items:center}
.path h3 em{font-style:normal;font-size:10.5px;color:#a08e78;letter-spacing:0}
.req{font-size:11.5px;color:#6f5c48;display:flex;justify-content:space-between;padding:2px 0}
.req b{font-weight:400;color:#4a3c2e;font-variant-numeric:tabular-nums}
.req.ok b{color:#3f7a4a}
.req.no b{color:#8f3a2c}
.path button{width:100%;font-family:inherit;font-size:12.5px;padding:7px;border-radius:2px;cursor:pointer;
  border:1px solid #849a72;background:#849a72;color:#fff;margin-top:8px;transition:background .12s}
.path button:disabled{opacity:.3;cursor:default;background:#bdb3a2;border-color:#bdb3a2}
.path button:not(:disabled):hover{background:#748a62}

/* 行动 */
.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.act{font-family:inherit;font-size:12.5px;padding:9px 6px;border-radius:2px;cursor:pointer;
  border:1px solid #d8cbb4;background:#fdfaf3;color:#4a3c2e;transition:background .12s;
  display:flex;flex-direction:column;align-items:center;gap:2px;will-change:transform}
.act:hover:not(:disabled){background:#f2ebdd}
.act:disabled{opacity:.35;cursor:default}
.act span{font-size:10px;color:#9c8a70}
.act.pass{background:#849a72;border-color:#849a72;color:#fff}
.act.pass span{color:#e4ebd9}
.act.pass:hover{background:#748a62}
.act.sys{display:none}

/* 底部导航 */
.nav{display:flex;flex-wrap:wrap;gap:5px;background:#faf6ee;border:1px solid #d8cbb4;border-radius:3px;padding:5px}
.nav button{flex:1 1 auto;min-width:84px;font-family:inherit;font-size:12.5px;letter-spacing:2px;
  padding:8px 4px;border-radius:2px;cursor:pointer;background:#f5efe3;border:1px solid #e0d5c0;
  color:#6f5c48;transition:background .16s,color .16s,border-color .16s;
  display:flex;align-items:center;justify-content:center;gap:6px}
.nav button:hover{background:#eee6d5}
.nav button.on{background:#7a4f30;border-color:#7a4f30;color:#f7f1e5}
.nav button.on .inkIcon{opacity:1}

/* 日志 */
.log{background:#faf6ee;border:1px solid #d8cbb4;border-radius:3px;padding:10px 14px;max-height:120px;overflow-y:auto}
.log p{font-size:12.5px;color:#5d4e3c;padding:3px 0;border-bottom:1px dotted #eee5d3;line-height:1.7}
.log p:last-child{border-bottom:none}
.log .t{color:#a08e78;font-size:10.5px;margin-right:6px}
.log .g{color:#3f7a4a}
.log .r{color:#8f3a2c}
.log .z{color:#5a4bb8}
.log .y{color:#8a6420}
.log .e{color:#a8527a}

#fxLayer{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}
.ftxt{position:absolute;font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;
  color:#7a4f30;text-shadow:0 1px 0 #fff,0 0 8px rgba(255,255,255,.9);will-change:transform,opacity}
.ftxt.plus{color:#3f7a4a}
.ftxt.minus{color:#8f3a2c}
.ftxt.zi{color:#5a4bb8}
#flash{position:fixed;inset:0;pointer-events:none;z-index:95;opacity:0;
  background:radial-gradient(closest-side,rgba(255,255,255,.9),rgba(140,120,255,.32) 45%,transparent 72%)}

#modal{position:fixed;inset:0;background:rgba(28,20,14,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
#modal.on{display:flex}
.mbox{background:#faf6ee;border-radius:4px;padding:24px 26px;max-width:520px;width:100%;max-height:86vh;overflow-y:auto;
  box-shadow:0 18px 50px rgba(0,0,0,.32);will-change:transform,opacity;border:1px solid #d8cbb4}
.mbox h2{font-size:16px;font-weight:400;letter-spacing:6px;color:#6f4526;text-align:center;margin-bottom:16px}
.mbox p{font-size:13px;color:#4a3c2e;margin-bottom:11px;line-height:2}
.mbox .q{color:#7a4f30}
.mbox .calc{background:#f2ebdd;border-radius:2px;padding:10px 12px;font-size:12.5px;color:#5d4e3c;margin-bottom:11px;line-height:2}
.mbox .calc b{color:#6f4526;font-weight:400}
.mbox button{width:100%;font-family:inherit;font-size:13.5px;padding:10px;border-radius:2px;cursor:pointer;
  border:1px solid #849a72;background:#849a72;color:#fff;margin-top:6px;transition:background .12s}
.mbox button.ghost{background:#f2ebdd;border-color:#d8cbb4;color:#5d4e3c}

var HAS_GSAP = typeof window.gsap !== 'undefined';
var REDUCE = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var MOTION = HAS_GSAP && !REDUCE;
var MT = { fast:0.16, base:0.30, slow:0.55 };
var ME = { out:'power3.out', back:'back.out(1.7)', inOut:'power2.inOut' };

function countTo(el, from, to){
  if(!el) return;
  if(!MOTION){ el.textContent = fmt(to); return; }
  var o = {v:from}; gsap.killTweensOf(o);
  gsap.to(o, { v:to, duration:MT.slow, ease:ME.out, overwrite:true,
    onUpdate:function(){ el.textContent = fmt(o.v); } });
}
function fmt(v){ return (Math.round(v*10)/10).toString().replace(/\.0$/,''); }

function floatText(x, y, text, cls){
  var layer = document.getElementById('fxLayer');
  var d = document.createElement('div');
  d.className = 'ftxt ' + (cls||''); d.textContent = text;
  d.style.left = x+'px'; d.style.top = y+'px';
  layer.appendChild(d);
  if(!MOTION){ setTimeout(function(){ d.remove(); }, 600); return; }
  gsap.fromTo(d, { y:0, opacity:0, scale:.7 }, { y:-44, opacity:1, scale:1, duration:MT.base, ease:ME.back });
  gsap.to(d, { y:-84, opacity:0, duration:MT.slow, delay:MT.base, ease:'power1.in', onComplete:function(){ d.remove(); } });
}
function flash(){
  if(!MOTION) return;
  var f = document.getElementById('flash');
  gsap.fromTo(f, { opacity:0 }, { opacity:.85, duration:.12,
    onComplete:function(){ gsap.to(f, { opacity:0, duration:.75, ease:'power2.out' }); } });
}
function shake(el, amp){
  if(!MOTION || !el) return;
  gsap.fromTo(el, { x:-amp }, { x:0, duration:.5, ease:'elastic.out(1,0.35)' });
}

var STORAGE_FALLBACK = false;
(function hydrateMemoryStore(){
  try{
    if(window.name && window.name.indexOf('ZFSAVE:')===0) MEM_STORE = JSON.parse(window.name.slice(7)) || {};
  }catch(e){ MEM_STORE = {}; }
})();
function storeGet(k){
  if(!STORAGE_FALLBACK){
    try{ return localStorage.getItem(k); }
    catch(e){ STORAGE_FALLBACK = true; }
  }
  return Object.prototype.hasOwnProperty.call(MEM_STORE,k) ? MEM_STORE[k] : null;
}
function storeSet(k,v){
  MEM_STORE[k] = v;
  if(!STORAGE_FALLBACK){
    try{ localStorage.setItem(k,v); return 'disk'; }
    catch(e){ STORAGE_FALLBACK = true; }
  }
  try{ window.name = 'ZFSAVE:'+JSON.stringify(MEM_STORE); return 'tab'; }
  catch(e){ return false; }
}
function storeRemove(k){
  delete MEM_STORE[k];
  if(!STORAGE_FALLBACK){
    try{ localStorage.removeItem(k); }
    catch(e){ STORAGE_FALLBACK = true; }
  }
  try{ if(STORAGE_FALLBACK) window.name = 'ZFSAVE:'+JSON.stringify(MEM_STORE); }catch(e){}
}

var SLOT_KEY = 'zifu_slot_';
function readSlot(n){
  try{
    var raw = storeGet(SLOT_KEY+n);

  }catch(e){ return null; }
}
function openSaves(){
  var h = '<h2>存 档</h2>'+
    '<div class="saveIntro">本局每旬自动保存。也可以把此刻写入手动存档，日后从这里回来。</div>';

  for(var i=1;i<=3;i++){
    var s = readSlot(i);
    h += '<div class="saveRow"><div class="sinfo"><b>存档 '+i+(s?'　'+s.label:'　空白')+'</b>'+
      '<em>'+(s?'写入于 '+s.real:'尚未写入')+'</em></div>'+
      '<div class="saveActions"><button onclick="saveSlot('+i+')">存入</button>'+
      (s?'<button class="ghost" onclick="loadSlot('+i+')">读取</button>'+
         '<button class="ghost danger" onclick="clearSlot('+i+')">清除</button>':'')+
      '</div></div>';
  }
  h += '<button class="ghost" onclick="closeModal()">合 上</button>';
  showModal(h);
}
function saveSlot(n){
  var raw;
  try{
    save();
    var payload = {
      v:1, real:new Date().toLocaleString('zh-CN',{hour12:false}),
      label:heroFull()+' · '+dateStr()+' · '+stageName(),
      data:G
    };
    raw = JSON.stringify(payload);
  }catch(e){
    console.warn('save slot serialize failed', e);
    toast('存档内容生成失败，请重试。');
    return;
  }
  var where = storeSet(SLOT_KEY+n, raw);
  if(!where){
    toast('这份存档无法写入。请确认浏览器允许本地存储。');
    return;
  }
  toast(where==='tab' ? ('已写入存档 '+n+'（仅本标签页）') : ('已写入存档 '+n));
  openSaves();
}
function loadSlot(n){
  var s = readSlot(n);
  if(!s || !s.data || s.data.v!==6 || !s.data.plots){ toast('这份存档已经损坏。'); return; }
  closeMobileZf();
  G = s.data;
  if(!G.freeUsed) G.freeUsed = {};
  SCENE = G.scene || 'hut';
  PET_SIGNATURE = null;
  SEASON_NOW = -1;
  PREV = {};
  save();
  closeModal();
  render();
  toast('已读取存档 '+n);
}
function clearSlot(n){
  storeRemove(SLOT_KEY+n);
  openSaves();
}

function toast(msg){

function ganzhi(y){ var i=(y-1)%60; return GAN.charAt(i%10)+ZHI.charAt(i%12); }

function apMax(){ return AP_MAX + G.stage; }
function cropBasePrice(k){
  var p = CROPS[k].price;
  if(k==='qing' && hasTrait('t_qing')) p++;
  if(k==='mi' && hasTrait('t_mi')) p++;
  return p;
}
function productBasePrice(id){ return PRODUCTS[id].price + (hasTrait('t_pets')?1:0); }
function marketDelta(k){
  if(!G.market || !G.market.delta) return 0;
  return G.market.delta[k] || 0;
}
function cropPrice(k){ return Math.max(1, cropBasePrice(k) + marketDelta(k)); }
function productPrice(id){ return Math.max(1, productBasePrice(id) + marketDelta(id)); }
function refreshMarket(force){
  if(!G.market) G.market = {turn:-1, delta:{}};
  if(!force && G.market.turn===G.turn && G.market.delta && Object.keys(G.market.delta).length) return;
  var delta = {}, keys = {qing:CROPS.qing.price, mi:CROPS.mi.price,
    egg:PRODUCTS.egg.price, milk:PRODUCTS.milk.price, fish:PRODUCTS.fish.price};
  for(var k in keys){
    var span = Math.max(1, Math.round(keys[k]*0.2));
    delta[k] = Math.floor(Math.random()*(span*2+1))-span;
  }
  G.market = {turn:G.turn, delta:delta};
}
function priceTrend(d){
  return d>0 ? ' ↑'+d : (d<0 ? ' ↓'+Math.abs(d) : ' —');
}
function productTotal(){ var n=0; for(var k in G.products) n+=G.products[k]||0; return n; }
function productSummary(){
  var parts=[];
  for(var k in PRODUCTS){ if((G.products[k]||0)>0) parts.push(PRODUCTS[k].short+(G.products[k])); }
  return parts.length ? parts.join(' · ') : '尚无出产';
}
function openCost(){ return Math.max(3, 4-(hasTrait('t_plots')?1:0)); }
function freeOnce(key, msg){
  if(!G.freeUsed) G.freeUsed = {};
  if(G.freeUsed[key]){ toast(msg || '这一旬已经做过了，等过旬罢。'); return false; }
  G.freeUsed[key] = 1;

function earthCoef(e){ return 0.5 + 0.5*e/100; }
function realYield(crop, e){ var n = Math.round(CROPS[crop].yield*earthCoef(e)); return n<1?1:n; }
function addStore(crop,n){ G.store[crop]=(G.store[crop]||0)+n; G.total+=n; G.harvest+=n; }
function seasonIdx(){ return Math.floor((G.month-1)/3); }

var SEASON_NOW = -1;
function applySeason(animate){
  var i = seasonIdx(), s = SEASONS[i];
  if(i === SEASON_NOW) return;
  var first = SEASON_NOW < 0;
  SEASON_NOW = i;
  if(animate && MOTION && !first) gsap.to(document.body, { backgroundColor:s.bg, duration:1.2, ease:ME.inOut });
  else document.body.style.backgroundColor = s.bg;
  buildSeasonFx(i);
}
function buildSeasonFx(i){
  var box = document.getElementById('seasonFx');
  box.innerHTML = '';
  if(!MOTION) return;
  var s = SEASONS[i], H = window.innerHeight || 800;
  for(var k=0;k<14;k++){
    var d = document.createElement('i');
    var size = 3 + Math.random()*4;
    d.style.width = size+'px'; d.style.height = size+'px';
    d.style.background = s.pf;
    d.style.borderRadius = s.shape==='leaf' ? '60% 10% 60% 10%' : '50%';
    d.style.left = (Math.random()*100)+'%';
    if(s.shape==='spark') d.style.boxShadow = '0 0 8px '+s.pf;
    box.appendChild(d);
    var up = (s.shape==='spark');
    var fromY = up ? H*0.9 : -30, toY = up ? -40 : H+40;
    var dur = 7 + Math.random()*9, drift = (Math.random()*2-1)*110;
    var tw = gsap.fromTo(d, { y:fromY, x:0, rotation:0 },
      { y:toY, x:drift, rotation: up?0:360, duration:dur, repeat:-1, ease: up?'sine.inOut':'none',
        onRepeat:function(){ gsap.set(this.targets()[0], { x:0 }); } });
    tw.time(Math.random()*dur);
  }
}

/* ======================= 时间 ======================= */
function spendAp(n){
  if(G.ap < n){ toast('这一旬的力气用尽了。歇一歇罢。'); return false; }
  G.ap -= n; return true;
}

function passXun(){
  if(G.over) return;
  G.xun++;
  if(G.xun>2){ G.xun=0; G.month++; }
  if(G.month>12){ G.month=1; G.year++; }

  for(var p=0;p<G.plots.length;p++){
    var pl=G.plots[p];
    if(pl.state==='种' && pl.crop && pl.grow < CROPS[pl.crop].grow) pl.grow++;
  }
  if(G.cd>0) G.cd--;
  G.turn++; G.ap = apMax(); G.freeUsed = {}; G.life -= DAYS_PER_XUN;
  refreshMarket();
  refreshOrders();
  if(G.stage>=3){
    G.zifuField = G.zifuField || {t:0};
    G.zifuField.t++;
    if(G.zifuField.t >= 6){
      G.zifuField.t = 0;
      var zy = hasTrait('t_dan') ? 2 : 1;
      G.store.ling = (G.store.ling||0) + zy;
      log('紫府田里那畦回灵草又长成了，收得 '+zy+' 株。','z');
    }
  }

  tickPets();
  if(G.life<=0){ ending('阳寿在这一旬走到了尽头。'); return; }
  checkEvents(); save();
  if(G.over) return;
  render();
  if(!G.over) maybeEvent();
}

function checkEvents(){
  if(G.turn - G.lastTax >= TAX_EVERY) doTax();
  if(G.turn - G.lastWinter >= WINTER_EVERY) doWinter();
}

/* 紫府突发：不常来，来了要作选择 */
function maybeEvent(){
  if(G.over || G.turn < 8 || Math.random() >= 0.09) return;
  var hasCrop = G.plots.some(function(p){ return p.state==='种' && p.crop; });
  var possible = ['well'];
  if(hasCrop && G.soil>0) possible.push('bolt');
  possible.push('merchant');
  var pick = possible[Math.floor(Math.random()*possible.length)];
  if(pick==='well') eventWell();
  else if(pick==='bolt') eventBolt();
  else eventMerchant();
}
function eventDone(msg, cls){
  if(msg) log(msg, cls||'z');
  closeModal(); save(); render();
}
function eventWell(){
  var can = feedTotal()>=2 && G.soil<ZF_MAX;
  showModal('<h2>井 底 有 声</h2>'+

    '<p class="q">它饿了。</p>'+
    '<div class="calc">埋 2 份口粮：紫府直接养熟 1 寸<br>不耗铜钱，不占余力。</div>'+

      (can?'把口粮撒下去':'口粮不够，只能听着')+'</button>'+
    '<button class="ghost" onclick="eventDone(\'你把井口压上石板。那声音低了下去，没有走远。\',\'\')">封住井口</button>');

function evWellFeed(){
  if(feedTotal()<2 || G.soil>=ZF_MAX){ toast('做不成了。'); return; }

function eventBolt(){

  var can = G.life>cost;
  showModal('<h2>紫 电 落 田</h2>'+
    '<p>一道紫电从井口窜出，贴着地皮掠过去。田里的苗都直了一瞬，叶尖发亮。</p>'+
    '<p class="q">紫府肯借，但要拿阳寿来抵。</p>'+

function evBoltTake(cost){
  if(G.life<=cost){ toast('阳寿不够了。'); return; }
  G.life -= cost;
  var n=0;
  for(var i=0;i<G.plots.length;i++){
    var p=G.plots[i];
    if(p.state==='种' && p.crop){
      p.grow = Math.min(CROPS[p.crop].grow, p.grow+1);
      p.earth = Math.min(100, p.earth+5); n++;
    }
  }
  eventDone(n?('紫电钻进土里。'+n+' 块田的苗一夜之间高了一截。你的手背多了几道细纹。'):'紫电落了空。','z');

function eventMerchant(){
  showModal('<h2>夜 半 叩 门</h2>'+
    '<p>一个披蓑衣的人站在门外，不进屋。他从袖里摸出一枚青灰色的小石，放在门槛上。</p>'+
    '<p class="q">「六十文。来路你不必问。」</p>'+
    '<div class="calc">铜钱 -60 文<br>灵石 +1 枚</div>'+

    '<button class="ghost" onclick="eventDone(\'你摇了摇头。那人把石头收回袖里，转身走进雨里。\',\'\')">关门</button>');

function evBuyStone(){
  if(G.money<60){ toast('铜钱不够。'); return; }
  G.money -= 60; G.stone++;
  eventDone('石头入手是温的。等你抬头，门外只剩一行湿脚印。','z');
}

function taxNeed(){
  var farm=0;
  for(var i=0;i<G.plots.length;i++) if(G.plots[i].state!=='荒') farm++;
  return farm*8;
}
function taxLeft(){ return TAX_EVERY - (G.turn - G.lastTax); }

function doTax(){
  G.lastTax = G.turn;
  var need = taxNeed();
  if(need<=0) return;
  if(G.money >= need){
    G.money -= need;
    log('蒋三来收租。你把铜钱数了三遍，'+need+'文，一枚不多。他掂了掂，收进褡裢，没说话。','y');
  }else{
    var farmed=[];
    for(var j=0;j<G.plots.length;j++) if(G.plots[j].state!=='荒') farmed.push(j);
    if(farmed.length>1){
      G.plots[farmed[farmed.length-1]] = mk('荒');
      log('铜钱不够。蒋三没抬眼，只弯腰把你一块田的界石拔了，扔在垄上。','r');
      G.money = 0;
    }else{
      G.money = 0;
      log('铜钱不够。蒋三看了看你仅剩的一块田，到底没有拔界石，只把桌上的零钱收走了。','r');
    }
  }
}

function doWinter(){
  G.lastWinter = G.turn;

    G.store.mi -= WINTER_MI;
    G.mom = Math.min(100, G.mom + 5);

      G.flags.momDead = true;

var ACTIONS = [
  {id:'open', name:'开荒', sub:'2 力 · 4 文'},
  {id:'harv', name:'收获', sub:'1 力'},
  {id:'pass', name:'过 旬', sub:'时辰往前走', pass:true},
  {id:'reset',name:'重开', sub:'清档'}
];
function ACT(id){
  if(id==='open') return doOpen();
  if(id==='harv') return doHarvestAll();
  if(id==='pass') return passXun();
  if(id==='reset') return confirmReset();
}
function doOpen(){
  var waste=-1;
  for(var i=0;i<G.plots.length;i++) if(G.plots[i].state==='荒'){ waste=i; break; }
  if(waste<0 && G.plots.length>=9){ toast('没有更多荒可开了。'); return; }
  if(G.money<openCost()){ toast('铜钱不够，'+openCost()+' 文也拿不出。'); return; }
  if(!spendAp(2)) return;
  G.money -= openCost();
  if(waste>=0) G.plots[waste] = {state:'田',crop:null,grow:0,earth:100};
  else G.plots.push(mk('田'));
  log('你刨了大半日，掌心磨出三个血泡，换来一块田。土里有碎石子，得一颗颗捡出去。','');
  save(); render();
}
function doHarvestAll(){
  var n=0, parts=[];
  for(var i=0;i<G.plots.length;i++){
    var p=G.plots[i];
    if(p.state==='种' && p.crop && p.grow>=CROPS[p.crop].grow){
      var y = realYield(p.crop, p.earth);
      addStore(p.crop, y);
      parts.push(CROPS[p.crop].name+'×'+y);
      G.plots[i] = {state:'田',crop:null,grow:0,earth:Math.max(0,p.earth-CROPS[p.crop].earth)};
      n++;
    }
  }
  if(n===0){ toast('还没有能收的。'); return; }
  if(!spendAp(1)) return;
  log('收了 '+n+' 块地。'+parts.join('、')+'。手指缝里全是泥。','g');
  save(); render();
  if(MOTION) gsap.fromTo('.plot', { scale:.94 }, { scale:1, duration:.5, ease:'elastic.out(1,0.6)', stagger:.04 });
}

/* ======================= 灵田 ======================= */
function openSeed(idx){
  var p = G.plots[idx];
  if(p.state!=='田') return;
  var html = '<h2>下 种</h2><p>这块田的地力是 '+Math.round(p.earth)+'。地薄，收得就少。</p>';
  for(var k in CROPS){
    var c = CROPS[k], earthOk = p.earth >= c.min, moneyOk = G.money >= c.seed, apOk = G.ap >= 1;
    var ok = earthOk && moneyOk && apOk, y = realYield(k, p.earth);
    var right = c.price>0 ? ('可收 '+y+' 份 · 净 '+(y*cropPrice(k)-c.seed)+' 文 · 耗地 '+c.earth)
                          : ('可收 '+y+' 株 · 不入市，只换灵石 · 耗地 '+c.earth);
    var fail = !earthOk ? ('需地力 '+c.min) : (!moneyOk ? ('缺 '+(c.seed-G.money)+' 文') : '余力不足');
    html += '<button class="row '+(ok?'':'ghost')+'" '+(ok?'':'disabled style="opacity:.4"')+' onclick="doSeed('+idx+',\''+k+'\')">'+
            '<span>'+c.name+'　'+c.seed+' 文 · '+c.grow+' 旬</span><em>'+(ok?right:fail)+'</em></button>';
  }
  html += '<button class="ghost" onclick="closeModal()">罢了</button>';
  showModal(html);
}
function doSeed(idx,k){
  var c = CROPS[k], p = G.plots[idx];
  if(!p || p.state!=='田'){ toast('这块田不能种。'); return; }
  if(p.earth < c.min){ toast('地力不够，需 '+c.min+'。'); return; }
  if(G.money < c.seed){ toast('铜钱不够。'); return; }
  if(!spendAp(1)) return;
  G.money -= c.seed;
  G.plots[idx] = {state:'种',crop:k,grow:0,earth:p.earth};
  log('你把'+c.name+'的种子按进土里。指腹沾了一层湿，凉的。','');
  closeModal(); save(); render(); popPlot(idx);
}
function popPlot(idx){
  if(!MOTION) return;
  var el = document.querySelector('.plot[data-i="'+idx+'"]');
  if(el) gsap.fromTo(el, { scale:.92 }, { scale:1, duration:.55, ease:'elastic.out(1,0.5)' });
}
function doHarvest(idx){
  var p = G.plots[idx];
  if(p.state!=='种' || !p.crop) return;
  var c = CROPS[p.crop];
  if(p.grow < c.grow){ toast('还没熟。'); return; }
  if(!spendAp(1)) return;
  var y = realYield(p.crop, p.earth);
  addStore(p.crop, y);
  var ne = Math.max(0, p.earth - c.earth);
  log('收了一季'+c.name+'，'+y+'份。地力从 '+Math.round(p.earth)+' 掉到 '+Math.round(ne)+'。','g');
  G.plots[idx] = {state:'田',crop:null,grow:0,earth:ne};
  save(); render(); flyToChip(idx, '+'+y+' '+c.name, c.price>0?'plus':'zi');
}
function flyToChip(idx, text, cls){
  if(!MOTION) return;
  var el = document.querySelector('.plot[data-i="'+idx+'"]');
  var chip = document.getElementById('chMoney');
  if(!el || !chip) return;
  var a = el.getBoundingClientRect();
  floatText(a.left + a.width/2 - 26, a.top + 12, text, cls);
}
function doRest(idx){
  var p = G.plots[idx];
  if(p.state!=='田'){ toast('只有空田能歇。'); return; }
  if(p.earth >= 100){ toast('这块田已经养得很肥了。'); return; }
  if(!spendAp(1)) return;
  var before = p.earth;
  p.earth = Math.min(100, p.earth + REST_GAIN);
  log('你让这块田空了一旬，翻进一层草木灰。地力 '+Math.round(before)+' → '+Math.round(p.earth)+'。','');
  save(); render(); popPlot(idx);
}

/* ======================= 竹岐县 ======================= */
function saleReserve(){
  var keep = WINTER_MI, nx = STAGES[G.stage+1];
  if(nx && G.soil < nx.soil) keep += soilCost().crop;
  return keep;
}
function sellPlan(mode){
  mode = mode || 'safe';
  var plan = {sum:0, parts:[], crops:{}, products:{}, reserve:saleReserve()};
  for(var k in G.store){
    if(k==='ling') continue;
    var have = G.store[k]||0;
    var n = have;
    if(mode==='safe' && k==='mi') n = Math.max(0, have-plan.reserve);
    if(n>0){ plan.sum += n*cropPrice(k); plan.parts.push(CROPS[k].name+'×'+n); plan.crops[k]=n; }
  }
  for(var pk in PRODUCTS){
    var pn = G.products[pk]||0;
    if(pn>0){ plan.sum += pn*productPrice(pk); plan.parts.push(PRODUCTS[pk].name+'×'+pn); plan.products[pk]=pn; }
  }
  return plan;
}
function doSell(mode){
  mode = mode || 'safe';
  var plan = sellPlan(mode);
  if(plan.sum===0){
    if(mode==='safe' && sellPlan('all').sum>0) toast('剩下的要留作冬粮和养土口粮，真要卖光就点「全卖」。');
    else toast('背篓是空的。');
    return;
  }
  if(!spendAp(1)) return;
  for(var k in plan.crops){
    G.store[k] -= plan.crops[k];
    if(G.store[k]<=0) delete G.store[k];
  }
  for(var pk in plan.products) G.products[pk] = 0;
  G.money += plan.sum;
  log('你在县城的摊子上蹲了半日，把'+plan.parts.join('、')+'换成'+plan.sum+'文铜钱。'+
    (mode==='safe'?'米缸里留了'+plan.reserve+'份糙米，没敢卖空。':'连米缸也见了底。'),'y');
  save(); render();
  if(MOTION){
    var chip = document.getElementById('chMoney');
    if(chip){ var r=chip.getBoundingClientRect(); floatText(r.left, r.top-8, '+'+plan.sum, 'plus'); }
  }
}
function tradeTip(){

  if((G.store.mi||0) < WINTER_MI) return '糙米至少留 4 份过冬；冬天米缸见底会折阳寿。';
  if(nx && G.soil < nx.soil) return '紫府还差活土：养下一寸要 '+soilCost().crop+' 份口粮，别把粮食卖空。';

}

var ORDER_POOL = [
  {kind:'crop', key:'mi', qty:10, reward:60, title:'县仓收米'},
  {kind:'crop', key:'qing', qty:12, reward:34, title:'采药堂要青菜'},

  {kind:'money', cost:150, stone:1, reward:0, title:'县学捐输', minStage:2},
  {kind:'money', cost:400, stone:2, reward:0, title:'修桥捐输', minStage:3}
];
function orderMonthKey(){ return G.year*12 + (G.month-1); }
function refreshOrders(force){
  if(!G.orders) G.orders = [];
  if(!force && G.orderMonth === orderMonthKey()) return;
  var pool = ORDER_POOL.filter(function(o){ return !o.minStage || G.stage>=o.minStage; });
  for(var i=pool.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=pool[i]; pool[i]=pool[j]; pool[j]=t; }
  G.orders = pool.slice(0,3).map(function(o){ return JSON.parse(JSON.stringify(o)); });
  G.orderMonth = orderMonthKey();
}
function orderNeedText(o){
  if(o.kind==='money') return '交 '+o.cost+' 文';
  var n = o.kind==='crop' ? CROPS[o.key].name : PRODUCTS[o.key].name;
  return '交 '+o.qty+' 份'+n;
}
function orderHave(o){
  if(o.kind==='money') return G.money;
  return o.kind==='crop' ? (G.store[o.key]||0) : (G.products[o.key]||0);
}
function canFulfillOrder(o){
  return G.ap>=1 && orderHave(o) >= (o.kind==='money' ? o.cost : o.qty);
}
function fulfillOrder(idx){
  var o = G.orders[idx];
  if(!o){ toast('这张订单已经收走了。'); return; }
  if(!canFulfillOrder(o)){
    toast(o.kind==='money' ? ('铜钱不够，需 '+o.cost+' 文。') : ('货不够，需 '+o.qty+' 份。'));
    return;
  }
  if(!spendAp(1)) return;
  if(o.kind==='money') G.money -= o.cost;
  else if(o.kind==='crop') G.store[o.key] -= o.qty;
  else G.products[o.key] -= o.qty;
  if(o.kind==='crop' && G.store[o.key]<=0) delete G.store[o.key];
  if(o.kind==='product' && G.products[o.key]<=0) G.products[o.key] = 0;
  if(o.reward) G.money += o.reward;
  if(o.stone) G.stone += o.stone;
  G.orders.splice(idx,1);
  log('你把货交到县里，销了「'+o.title+'」。'+(o.stone?('换回灵石 '+o.stone+' 枚。'):('得铜钱 '+o.reward+' 文。')),'y');
  save(); render();
}
function buyAsh(idx){  if(G.money < ASH_PRICE){ toast('铜钱不够，八文也拿不出。'); return; }
  if(!spendAp(1)) return;

  p.earth = Math.min(100, p.earth + ASH_GAIN);
  log('你在县城买了一担草木灰，挑回来撒进'+['甲','乙','丙','丁','戊','己','庚','辛','壬'][idx]+'田。地力 '+Math.round(p.earth)+'。','');
  save(); render(); popPlot(idx);

function refineStone(){
  if((G.store.ling||0) < LING_PER_STONE){ toast('回灵草不够，要四株。'); return; }
  if(!spendAp(1)) return;
  G.store.ling -= LING_PER_STONE;

  G.stone++;
  log('丹房的老者接过四株回灵草，看也不看，丢进炉里。半晌推出一枚下品灵石，青灰色，还有余温。','z');

/* ======================= 紫府 ======================= */
function consumeFeed(need){
  var order = [];
  for(var k in G.store) if(k!=='ling') order.push(k);
  order.sort(function(a,b){ return CROPS[a].price - CROPS[b].price; });
  for(var i=0;i<order.length && need>0;i++){
    var kk = order[i], take = Math.min(G.store[kk]||0, need);
    G.store[kk] -= take; need -= take;
    if(G.store[kk]===0) delete G.store[kk];
  }
  return need===0;
}
function soilCost(){
  var crop = 3 + Math.floor(G.soil/3) - (hasTrait('t_soil')?1:0);
  var money = 10 + G.soil*5;
  if(hasTrait('t_jade')) money = Math.ceil(money*0.9);
  return { crop:Math.max(2,crop), money:money };
}

/* ======================= 突破 ======================= */
function canBreak(){
  var n = STAGES[G.stage+1];
  if(!n) return false;
  return G.stone >= n.stone && G.money >= n.money && G.soil >= n.soil;
}
function doBreak(){
  var n = STAGES[G.stage+1];
  if(!n) return;
  if(!canBreak()){ toast('资粮未备。'); return; }
  G.stone -= n.stone;
  G.money -= n.money;
  var gain = (n.life - STAGES[G.stage].life)*DAYS_PER_YEAR;
  var fromStage = G.stage;
  G.stage++; G.life += gain; G.ap = apMax();
  log('你把积下的灵石一枚枚按进识海。石皮裂开，气涌上来，冲得你眼前发白。'+n.name+'。','z');
  if(fromStage<2 && G.stage>=2) log('炼气之后，紫府借时只取廿五倍。催熟的代价，轻了一分。','z');
  if(fromStage<3 && G.stage>=3){
    G.zifuField = G.zifuField || {t:0};
    log('夯基之时，井底又开出一畦新土。紫府田自生回灵草，每六旬可收一株。','z');
  }
  if(fromStage<4 && G.stage>=4) log('丹成之日，紫府田里结出一枚真种。此后每次收得两株回灵草。','e');
  save(); render(); breakthroughFx(n.name);
  if(G.stage >= 4) setTimeout(showVictory, 1200);
}

    '<p class="q">三十年前，你只想让一家人熬过冬天。如今你站在这里，路才刚开了一个头。</p>'+

var EGG_SPOTS = {
  hut:{label:'墙根压着半块旧瓦', flavor:'你搬开墙根那块旧瓦，底下潮气很重，像是许久没人动过。'},
  field:{label:'田埂草丛里有响动', flavor:'你顺着田埂拨开草，露水打湿了半截袖子。'},
  pen:{label:'草窝里咕哝了一声', flavor:'草窝里暖烘烘的，你伸手探了探。'},
  gate:{label:'车辙里闪了一下', flavor:'村口过了一辆车，泥里的东西被车轮碾得半露。'},
  county:{label:'街角有人掉了东西', flavor:'街角人来人往，墙角却有个东西没被人捡走。'},
  dao:{label:'旧册里露出半页纸', flavor:'你整理旧物，一张发黄的纸从册页里滑出来。'}
};
function sceneEggHtml(){
  if(!G || G.over) return '';
  var spot = EGG_SPOTS[SCENE] || {label:'四处看看'};
  var used = G.freeUsed && G.freeUsed.egg;
  return '<button class="eggSpot" '+(used?'disabled':'onclick="sceneEgg()"')+'>'+
    (used?'这一旬已经四处看过了':'偶有微光 · '+spot.label)+'</button>';
}
function sceneEgg(){
  if(!G || G.over) return;
  if(!freeOnce('egg','这一旬已经四处看过了。')) return;
  var spot = EGG_SPOTS[SCENE] || {flavor:'你四处看了看。'};
  var gains = [], tier = G.stage;
  function takeCrop(k,n){
    G.store[k] = (G.store[k]||0) + n;
    gains.push(CROPS[k].name+' +'+n);
  }
  function takeCopper(n){ G.money += n; gains.push('铜钱 +'+n+' 文'); }
  var roll = Math.random();
  if(SCENE==='hut'){
    if(roll<0.5) takeCopper(2+Math.floor(Math.random()*(3+tier*2)));
    else takeCrop('qing', 1+Math.floor(Math.random()*2));
  }else if(SCENE==='field'){
    if(roll<0.5) takeCrop('qing', 1+Math.floor(Math.random()*2));
    else if(tier>=1) takeCrop('mi',1);
    else takeCopper(3+Math.floor(Math.random()*(2+tier*2)));
  }else if(SCENE==='pen'){
    if(G.pets.length){
      var ap = PET_TYPES[G.pets[Math.floor(Math.random()*G.pets.length)].type];
      G.products[ap.product] = (G.products[ap.product]||0)+1;
      gains.push(PRODUCTS[ap.product].name+' +1');
    }else{
      G.products.egg = (G.products.egg||0)+1;
      gains.push('禽蛋 +1');
    }
  }else if(SCENE==='gate'){
    if(roll<0.5) takeCrop('mi',1);
    else takeCopper(3+Math.floor(Math.random()*(3+tier*2)));
  }else if(SCENE==='county'){
    if(roll<0.4){ G.store.ling=(G.store.ling||0)+1; gains.push('回灵草 +1'); }
    else takeCopper(4+Math.floor(Math.random()*(4+tier*2)));
  }else{
    if(roll<0.5){
      var add=20+tier*10; G.life += add; gains.push('阳寿 +'+(Math.round(add/DAYS_PER_YEAR*10)/10)+' 年');
    }else takeCopper(5+Math.floor(Math.random()*(4+tier*2)));
  }
  log('你随手探了探，得了'+gains.join('、')+'。','e');
  save(); render();
  showModal('<h2>偶 得</h2><p>'+spot.flavor+'</p>'+
    '<div class="calc">'+gains.join('<br>')+'</div>'+
    '<button onclick="closeModal()">收进袖里</button>');
}

/* ======================= 渲染 ======================= */
function nextHint(){
  var farmed=0, empty=0, mature=0, plantable=false, nx=STAGES[G.stage+1];
  refreshMarket();
  refreshOrders();
  for(var i=0;i<G.plots.length;i++){
    var p=G.plots[i];
    if(p.state==='荒') continue;
    farmed++;
    if(p.state==='种' && p.crop && p.grow>=CROPS[p.crop].grow) mature++;
    if(p.state==='田'){
      empty++;
      if(p.earth>=CROPS.qing.min) plantable=true;
    }
  }
  if(!farmed) return {text:'院外还都是荒草。先去<b>灵田</b>，花 2 点余力开一块田。',cta:'去灵田',target:'field'};
  if(mature) return {text:'有 '+mature+' 块庄稼熟了，去<b>灵田</b>收回来。',cta:'去收获',target:'field'};
  if(canBreak()) return {text:'资粮已经备齐，打开<b>道途</b>突破。',cta:'去突破',target:'path'};
  for(var oi=0;oi<G.orders.length;oi++){
    if(canFulfillOrder(G.orders[oi])) return {text:'县里有<b>'+G.orders[oi].title+'</b>可以交付，本月订单月底换新。',cta:'去县城',target:'county'};
  }
  if(empty && plantable && G.money>=1) return {text:'还有空田。下种后过两旬就有收成，<b>青菜</b>回本最快。',cta:'去下种',target:'field'};
  if(G.money<8 && sellPlan('all').sum>0) return {text:'铜钱见底了，背篓里的东西可以去<b>竹岐县</b>换钱。',cta:'去卖货',target:'county'};
  if(G.money<5 && sellPlan('all').sum===0 && !G.freeUsed.work && G.ap>=1)
    return {text:'没有本钱了，去<b>村口</b>帮人做一趟短工，先换几文种钱。',cta:'去村口',target:'gate'};
  if(nx && G.soil<nx.soil){
    var sc=soilCost();
    if(feedTotal()<sc.crop) return {text:'紫府还差 '+(nx.soil-G.soil)+' 寸活土。先留足 <b>'+sc.crop+' 份口粮</b>，再养下一寸。',cta:'去种粮',target:'field'};
    if(G.money<sc.money) return {text:'养土还差 <b>'+(sc.money-G.money)+' 文</b>，卖些青菜或禽蛋。',cta:'去卖货',target:'county'};
    return {text:'口粮与铜钱够了，打开<b>紫府</b>养第 '+(G.soil+1)+' 寸土。',cta:'开紫府',target:'zf'};
  }
  if(nx && G.stone<nx.stone) return {text:'突破还差 <b>'+(nx.stone-G.stone)+' 枚灵石</b>。地力到 70 就种回灵草，四株换一枚。',cta:'去灵田',target:'field'};
  if(nx && G.money<nx.money) return {text:'突破还差 <b>'+(nx.money-G.money)+' 文</b>，去县城卖余粮。',cta:'去县城',target:'county'};
  if(empty) return {text:'空田闲着也是闲着，地力不足就先<b>歇田</b>。',cta:'去灵田',target:'field'};
  return {text:'活都做完了，<b>过旬</b>歇一歇，等庄稼长。',cta:'',target:''};
}

  var bb = document.getElementById('btnBreak');

/* ======================= 家畜 ======================= */
var PET_NODES = [];
var PET_GEN = 0;
var PET_SIGNATURE = null;

function mountPets(){
  var host = document.getElementById('petLayer');
  if(!host || !G) return;
  var signature = G.pets.map(function(p){ return p.type; }).join('|');
  if(signature === PET_SIGNATURE) return;  // 切换场景、过旬时不打断行走
  PET_SIGNATURE = signature;
  PET_GEN++;
  for(var i=0;i<PET_NODES.length;i++){
    var old = PET_NODES[i];
    if(old){
      if(MOTION){ gsap.killTweensOf(old); if(old._body) gsap.killTweensOf(old._body); }
      if(old.parentNode) old.parentNode.removeChild(old);
    }
  }
  PET_NODES = [];
  if(!G.pets.length) return;

  for(var j=0;j<G.pets.length;j++){
    (function(idx, container){
      var d = document.createElement('div');
      d.className = 'pet';
      d.title = '点一点';
      d.innerHTML = '<span class="shadow"></span>'+
                    '<span class="body">'+petArt(G.pets[idx].type)+'</span>'+
                    '<span class="bub"></span>';
      d._body = d.querySelector('.body');
      d.addEventListener('click', function(){ petClick(idx); });
      container.appendChild(d);
      PET_NODES[idx] = d;
      startPet(idx);
    })(j, host);
  }
}

function petBounds(host){
  host = host || (PET_NODES[0] && PET_NODES[0].parentNode);
  if(!host) return {w:300,h:160};
  return { w: Math.max(60, host.clientWidth - 40), h: Math.max(40, host.clientHeight - 44) };
}

function startPet(i){
  var el = PET_NODES[i];
  if(!el) return;
  var b = petBounds(el.parentNode);
  var sx = 8 + Math.random()*Math.max(10, b.w-8);
  var sy = b.h*0.30 + Math.random()*Math.max(10, b.h*0.55);
  el._x = sx; el._y = sy;
  if(MOTION){
    gsap.set(el, { x:sx, y:sy });
    gsap.to(el._body, { y:-2, duration:.5+Math.random()*.4, yoyo:true, repeat:-1, ease:'sine.inOut' });
  }else{
    el.style.transform = 'translate('+sx+'px,'+sy+'px)';
  }
  walkStep(i, PET_GEN);
}

function walkStep(i, gen){
  var el = PET_NODES[i];
  if(!el || gen !== PET_GEN || !MOTION || !G || G.over) return;
  var b = petBounds(el.parentNode);
  var tx = 8 + Math.random()*Math.max(10, b.w-8);
  var ty = b.h*0.26 + Math.random()*Math.max(10, b.h*0.62);
  var dx = tx - el._x, dy = ty - el._y;
  var dist = Math.sqrt(dx*dx + dy*dy);
  if(dist < 26){ setTimeout(function(){ walkStep(i, gen); }, 60); return; }
  var dir = dx > 0 ? 1 : -1;
  el._x = tx; el._y = ty;
  var spd = [1.0, 0.85, 1.0, 1.5][seasonIdx()];
  var base = (2.4 + Math.random()*2.2) * spd;
  gsap.to(el._body, { scaleX:dir, duration:.18, ease:'power1.out' });
  gsap.to(el, { y:ty, duration: base*(0.6+Math.random()*0.3), ease:'sine.inOut' });
  gsap.to(el, { x:tx, duration: base, ease:'sine.inOut', onComplete:function(){ walkStep(i, gen); } });
}

function petClick(i){
  var el = PET_NODES[i], p = G.pets[i];
  if(!el || !p) return;
  var lines = {
    chicken:['咕——','抖了抖翅膀。','在土里啄了一下，什么也没有。'],
    duck:['嘎。','晃了晃屁股。','把头埋进翅膀里，不理你。'],
    goat:['咩——','用角顶了顶篱笆。','嚼着一根草，慢慢看你。'],
    cat:['喵。','蹭了蹭你的裤脚。','尾巴尖抖了一下。','跳上墙头，又跳下来。']
  };
  var arr = lines[p.type] || ['……'];
  var bub = el.querySelector('.bub');
  if(bub){
    bub.textContent = arr[Math.floor(Math.random()*arr.length)];
    if(MOTION){
      gsap.killTweensOf(bub);
      gsap.fromTo(bub, { opacity:0, y:4 }, { opacity:1, y:0, duration:.2,
        onComplete:function(){ gsap.to(bub, { opacity:0, y:-8, duration:.4, delay:1.3 }); } });
    }
  }
  if(MOTION) gsap.fromTo(el, { scaleY:.82 }, { scaleY:1, duration:.5, ease:'elastic.out(1,0.4)' });
  var r = el.getBoundingClientRect();
  floatText(r.left, r.top-6, '♥', 'plus');
}

var KONAMI = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
var kbuf = [];
document.addEventListener('keydown', function(e){
  kbuf.push(e.key.length===1 ? e.key.toLowerCase() : e.key);
  if(kbuf.length > KONAMI.length) kbuf.shift();
  if(kbuf.join(',') === KONAMI.join(',')){
    kbuf = [];
    if(!G || G.flags.konami) return;
    G.flags.konami = true;
    G.money += 100;
    flash();
    log('天上掉下一百文钱，砸在草垛上，滚了一地。没人看见。','e');
    toast('不可说');

      document.querySelectorAll('.pet').forEach(function(el, idx){
        gsap.to(el, { y:'-=18', duration:.28, yoyo:true, repeat:5, ease:'power1.inOut', delay:idx*.08 });
      });
    }
    save(); render();
  }
});

function cleanName(v, max){
  var s = (v||'').replace(/\s+/g,'');
  if(!/^[\u3400-\u9fa5A-Za-z]{1,8}$/.test(s)) return '';
  return s.length<=max ? s : '';
}
function pickGiven(pool, used){
  var left = pool.filter(function(n){ return !used[n]; });
  var n = left[Math.floor(Math.random()*left.length)] || pool[0];
  used[n] = 1;
  return n;
}
function commitName(){
  var sur = cleanName(document.getElementById('nSurname').value, 2);
  var given = cleanName(document.getElementById('nGiven').value, 3);
  if(!sur || !given){
    toast('姓取一至二字，名取一至三字，只可用汉字或字母。');
    return;
  }
  G.surname = sur;
  G.heroGiven = given;
  var used = {}; used[given] = 1;
  G.brotherGiven = pickGiven(['禾','砚','舟','岑','松','川','野','朴'], used);
  G.sisterGiven = pickGiven(['苗','菱','芽','杏','棠','苓','穗','荷'], used);
  startPlay();
}

function startPlay(){

/* ======================= 启动 ======================= */
(function boot(){
  document.getElementById('btnBreak').onclick = doBreak;
  document.getElementById('btnSoil').onclick = doSoil;
  document.getElementById('well').addEventListener('click', puzzleWell);
  if(!HAS_GSAP) document.body.style.backgroundColor = SEASONS[0].bg;

  if(load()){ render(); if(G.logs.length===0) log('你回来了。',''); }
  else {
    newGame(); render();
    if(location.hash==='#play') startPlay(); else intro();
  }

  if(MOTION){
    gsap.to('#fog', { x:26, y:-12, duration:11, repeat:-1, yoyo:true, ease:'sine.inOut' });
    setInterval(function(){ if(!document.hidden && Math.random()<0.35) boltFlash(); }, 3400);
  }

  var rt;
  window.addEventListener('resize', function(){
    clearTimeout(rt);
    rt = setTimeout(function(){ mountPets(); }, 240);
  });
})();
